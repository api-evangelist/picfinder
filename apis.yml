aid: picfinder
name: PicFinder
description: >-
  PicFinder (PicFinder.ai) is an AI-powered image generation platform that turns
  text prompts into unlimited realistic, artistic, and abstract images in near
  real time. Beyond the consumer web app and Figma plugin, PicFinder exposes a
  developer API for programmatic image inference powered by the RunWare /
  DiffusionMaster inference platform. The API is delivered over a WebSocket
  connection and authenticated with an API key, and supports text-to-image and
  image-to-image generation, model and LoRA selection (including CivitAI models),
  ControlNet guidance, inpainting and outpainting, background removal, GAN
  upscaling, image-to-text interrogation, prompt enhancement, and similar-image
  retrieval. A first-party JavaScript / TypeScript SDK (picfinder-sdk) wraps the
  WebSocket protocol for both browser and Node.js environments. PicFinder was
  surfaced as an a16z portfolio company and profiled into the API Evangelist
  network.
